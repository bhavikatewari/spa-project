<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavika Tewari | SPA Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="app-header">
        <div class="logo">Bhavika Tewari <span>SPA</span></div>
        <nav>
            <ul class="nav-links">
                <li><a href="/" class="nav-link" data-route="/">Home</a></li>
                <li><a href="/about" class="nav-link" data-route="/about">About</a></li>
                <li><a href="/skills" class="nav-link" data-route="/skills">Skills</a></li>
                <li><a href="/contact" class="nav-link" data-route="/contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Dynamic Content Container -->
    <main id="app" class="content-container" role="main" aria-live="polite">
        <!-- Content will be dynamically injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2026 Bhavika Tewari. Built with Vanilla JavaScript SPA Routing.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
